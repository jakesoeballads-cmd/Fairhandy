name: Logo von der alten Website holen

on:
  push:
    branches: [inhalte-alte-website]
    paths: [.github/workflows/alte-bilder-holen.yml]

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herunterladen
        run: |
          mkdir -p public/img
          curl -fsSL -o public/img/logo-alt.jpg https://fairhandy.eu/wp-content/uploads/2024/12/Logo-transparent--scaled.jpg
          file public/img/logo-alt.jpg
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img
          git commit -m "Logo der alten Website übernehmen"
          git push
